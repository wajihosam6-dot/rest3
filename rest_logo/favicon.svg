<!--
  REST brand asset v1 — Favicon (SVG).
  Bold redrawing of the ripple-horizon symbol on a solid Night Lagoon tile
  so it stays readable at 16px on any browser chrome. Thicker strokes than
  the print symbol; no text (text is illegible at favicon size).
  Use as: <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="REST">
  <rect width="64" height="64" rx="14" fill="#0C1F24"/>
  <g fill="none" stroke="#F3EEE3" stroke-width="4" stroke-linecap="round">
    <line x1="12" y1="32" x2="52" y2="32"/>
    <ellipse cx="32" cy="32" rx="13" ry="4"/>
    <ellipse cx="32" cy="32" rx="23" ry="7" opacity="0.65"/>
  </g>
  <circle cx="32" cy="32" r="4.5" fill="#B9976B"/>
</svg>
